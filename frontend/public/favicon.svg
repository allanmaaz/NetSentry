<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="nCyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="nAmberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Outline -->
  <path d="M32 4 L54 12 C54 36 44 52 32 60 C20 52 10 36 10 12 Z" 
        fill="url(#shieldBg)" 
        stroke="url(#shieldBorder)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Inner Bevel Crest -->
  <path d="M32 8 L50 15 C50 34 41 48 32 55 C23 48 14 34 14 15 Z" 
        fill="none" 
        stroke="#1e293b" 
        stroke-width="1" 
        opacity="0.8" />

  <!-- Constellation Mesh Lines (Background Network) -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.6">
    <line x1="22" y1="20" x2="32" y2="16" />
    <line x1="32" y1="16" x2="42" y2="20" />
    <line x1="22" y1="20" x2="22" y2="44" />
    <line x1="22" y1="20" x2="42" y2="44" />
    <line x1="42" y1="20" x2="42" y2="44" />
    <line x1="22" y1="44" x2="32" y2="48" />
    <line x1="42" y1="44" x2="32" y2="48" />
  </g>

  <!-- Center 'N' Nexus Path (Forensic Cyan to Amber Gold) -->
  <path d="M22 44 L22 20 L42 44 L42 20" 
        stroke="url(#nAmberGlow)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <path d="M22 44 L22 20 L32 32" 
        stroke="url(#nCyanGlow)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Luminous Graph Nodes -->
  <!-- Left Cyan Nodes -->
  <circle cx="22" cy="20" r="2.5" fill="#38bdf8" />
  <circle cx="22" cy="44" r="2.5" fill="#38bdf8" />
  <circle cx="22" cy="32" r="1.5" fill="#bae6fd" />

  <!-- Center Pivot Node -->
  <circle cx="32" cy="32" r="2" fill="#ffffff" filter="url(#glow)" />

  <!-- Right Amber Nodes -->
  <circle cx="42" cy="20" r="2.5" fill="#fbbf24" />
  <circle cx="42" cy="44" r="2.5" fill="#fbbf24" />
  <circle cx="42" cy="32" r="1.5" fill="#fde68a" />
</svg>