<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="nsAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="nsCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="nsShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Canvas Background -->
  <rect width="64" height="64" rx="14" fill="#020617" />

  <!-- Minimal Outer Shield Contour -->
  <path d="M16 20 L26 14 L32 18 L38 14 L48 20 C48 38 38 48 32 52 C26 48 16 38 16 20 Z"
        stroke="url(#nsShield)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="#040814" />

  <!-- Interlocking Minimal 'N' and 'S' Dynamic Ribbon -->
  <!-- 'N' Left Pillar & Diagonal (Amber) -->
  <path d="M24 40 L24 24 L38 38 L38 22"
        stroke="url(#nsAmber)"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- 'S' Lower Counter-Lock (Cyan) -->
  <path d="M38 34 L38 40 L28 46 L24 40"
        stroke="url(#nsCyan)"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Minimal Focal Node -->
  <circle cx="31" cy="31" r="2.2" fill="#ffffff" />
</svg>