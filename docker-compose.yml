version: '3.8'

services:
  # Neo4j Graph Database (Community Edition with APOC & GDS)
  neo4j:
    image: neo4j:5.18.0-community
    container_name: netsentry-neo4j
    ports:
      - "7474:7474" # Browser HTTP
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/netsentry2026
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  # NetSentry FastAPI Backend Engine
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: netsentry-backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=netsentry2026
    depends_on:
      - neo4j
    restart: unless-stopped

volumes:
  neo4j_data:
